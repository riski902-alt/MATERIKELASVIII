<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INFORMATIKA FUN - Kelas VIII</title>
    <!-- Font Poppins untuk kesan modern dan bersih -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome untuk ikon-ikon Informatika -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* ================= VARIABEL WARNA (Disesuaikan dengan index 2) ================= */
        :root {
            --bg-color: #4A7298;        /* Solid Denim Blue */
            --card-bg: #1E3A5F;         /* Solid Navy Blue */
            --card-hover-bg: #23436b;   /* Hover Navy Blue */
            --border-color: #88D4AB;     /* Highlight Hijau Mint */
            --border-hover: #A3E4C2;     /* Highlight Hijau Mint Cerah */
            --text-title: #ffffff;       /* Teks Judul Putih */
            --text-subtitle: #e5e7eb;    /* Teks Subtitle Abu Terang */
            --icon-color: #88D4AB;       /* Warna Ikon Hijau Mint */
        }

        /* ================= RESET & BASE ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            overflow-x: hidden;
            color: var(--text-title);
        }

        /* ================= ELEMEN BACKGROUND FLOATING ================= */
        .bg-elements {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0;
            pointer-events: none;
        }
        .bg-icon {
            position: absolute;
            color: #ffffff;
            opacity: 0.15; /* Transparansi disesuaikan agar lembut */
            font-size: 2.5rem;
            animation: float-anim 10s infinite ease-in-out;
        }
        @keyframes float-anim {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(5deg); }
        }
        .bg-1 { top: 15%; left: 10%; font-weight: bold; }
        .bg-2 { top: 30%; right: 12%; animation-delay: 1.5s; }
        .bg-3 { top: 60%; left: 8%; font-weight: bold; animation-delay: 3s; }
        .bg-4 { top: 75%; right: 15%; animation-delay: 2s; }
        .bg-5 { top: 85%; left: 20%; animation-delay: 4s; }
        .bg-6 { top: 10%; right: 25%; animation-delay: 1s; }

        /* ================= HEADER & LOGO ================= */
        header {
            text-align: center;
            padding: 30px 20px 20px;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo paling atas bagian tengah & ukuran diperkecil */
        .header-logo {
            width: 60px; /* Ukuran diperkecil secara proporsional */
            height: auto;
            margin-bottom: 12px;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.2));
            transition: transform 0.3s ease;
        }
        .header-logo:hover {
            transform: scale(1.05);
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 5px;
            color: var(--text-title);
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        header p {
            font-size: 1rem;
            font-weight: 500;
            color: var(--text-subtitle);
        }

        /* ================= SUSUNAN TOMBOL ================= */
        main {
            width: 100%;
            max-width: 750px;
            padding: 0 20px 40px;
            z-index: 1;
            flex: 1;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 18px; /* Jarak antar tombol */
        }

        /* ================= BENTO BUTTONS (Gaya Sesuai Index 2) ================= */
        .bento-btn {
            display: flex;
            align-items: center;
            text-decoration: none;
            padding: 20px 24px;
            border-radius: 24px; /* Sudut membulat disamakan dengan index 2 */
            background-color: var(--card-bg);
            border: 3px solid var(--border-color); /* Border tebal warna mint */
            color: var(--text-title);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        .bento-btn i {
            font-size: 1.6rem;
            width: 40px;
            margin-right: 15px;
            text-align: center;
            color: var(--icon-color); /* Warna ikon hijau mint */
            transition: transform 0.3s ease;
        }
        .bento-btn span {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.4;
        }

        /* ================= HOVER & ACTIVE EFEK ================= */
        .bento-btn:hover {
            transform: scale(1.03) translateY(-4px); /* Efek terangkat & membesar */
            background-color: var(--card-hover-bg);
            border-color: var(--border-hover);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.35);
        }
        .bento-btn:hover i {
            transform: scale(1.15) rotate(5deg);
        }

        .bento-btn:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        /* Efek Ripple */
        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0);
            animation: ripple-anim 0.4s linear;
            pointer-events: none;
        }
        @keyframes ripple-anim {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }

        /* ================= FOOTER ================= */
        footer {
            text-align: center;
            padding: 20px;
            z-index: 1;
            font-size: 0.85rem;
            color: var(--text-subtitle);
            opacity: 0.8;
        }

        /* ================= RESPONSIVE ================= */
        @media (max-width: 600px) {
            header h1 { font-size: 2rem; }
            .header-logo { width: 50px; } /* Logo lebih kecil di HP */
            .bento-btn { padding: 16px 18px; border-radius: 18px; }
            .bento-btn span { font-size: 0.95rem; }
            .bento-btn i { font-size: 1.3rem; }
        }
    </style>
</head>
<body>

    <!-- Elemen Dekoratif Latar Belakang -->
    <div class="bg-elements">
        <div class="bg-icon bg-1">&lt;/&gt;</div>
        <div class="bg-icon bg-2"><i class="fas fa-network-wired"></i></div>
        <div class="bg-icon bg-3">0 1</div>
        <div class="bg-icon bg-4"><i class="fas fa-wifi"></i></div>
        <div class="bg-icon bg-5"><i class="fas fa-cloud"></i></div>
        <div class="bg-icon bg-6"><i class="fas fa-mouse-pointer"></i></div>
    </div>

    <!-- Header dengan Logo di Atas -->
    <header>
        <!-- Logo Ditambahkan di Sini -->
        <img src="https://cdn.phototourl.com/member/2026-10-20-301bf8f0-f5cd-4de0-a3fd-b9b3a2d0e3e0.png" alt="Logo Informatika Fun" class="header-logo">
        <h1>KELAS VIII</h1>
        <p>Pembelajaran Informatika – Kelas VIII</p>
    </header>

    <!-- Kumpulan Tombol Navigasi -->
    <main>
        <div class="btn-container">
            
            <a href="https://riski902-alt.github.io/MATERIBAB-I-KELASVIII/" class="bento-btn">
                <i class="fas fa-project-diagram"></i>
                <span>Bab 1: Berpikir Komputasional</span>
            </a>

            <a href="https://riski902-alt.github.io/MATERIBAB-II-KELASVIII/" class="bento-btn">
                <i class="fas fa-microchip"></i>
                <span>Bab 2: Sistem Komputer</span>
            </a>

            <a href="https://riski902-alt.github.io/MATERIBAB-III-KELASVIII/" class="bento-btn">
                <i class="fas fa-globe"></i>
                <span>Bab 3: Jaringan Komputer dan Internet</span>
            </a>

            <a href="https://riski902-alt.github.io/MATERIBAB-IV-KELASVIII/" class="bento-btn">
                <i class="fas fa-users"></i>
                <span>Bab 4: Dampak Sosial Informatika</span>
            </a>

            <a href="LINK_SUMATIF_1" class="bento-btn">
                <i class="fas fa-clipboard-check"></i>
                <span>Sumatif Akhir Semester 1</span>
            </a>

            <a href="LINK_SUMATIF_2" class="bento-btn">
                <i class="fas fa-bullseye"></i>
                <span>Sematif Akhir Semester 2</span>
            </a>

        </div>
    </main>

    <!-- Footer -->
    <footer>
        INFORMATIKA FUN @ By: Riski Amalia, S.Pd
    </footer>

    <!-- Script JavaScript untuk Efek Klik Ripple -->
    <script>
        document.querySelectorAll('.bento-btn').forEach(btn => {
            btn.addEventListener('click', function (e) {
                let href = this.getAttribute('href');

                let rect = this.getBoundingClientRect();
                let x = e.clientX - rect.left;
                let y = e.clientY - rect.top;

                let ripple = document.createElement('span');
                ripple.classList.add('ripple');
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';

                let size = Math.max(rect.width, rect.height);
                ripple.style.width = ripple.style.height = size + 'px';
                ripple.style.marginTop = ripple.style.marginLeft = -(size / 2) + 'px';

                this.appendChild(ripple);

                setTimeout(() => {
                    ripple.remove();
                    if (href && href !== '#' && !href.startsWith('LINK_')) {
                        window.location.href = href;
                    }
                }, 300);
            });
        });
    </script>
</body>
</html>
